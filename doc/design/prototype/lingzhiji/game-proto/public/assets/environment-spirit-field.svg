<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFE3DA"/>
      <stop offset="100%" stop-color="#F4EFE0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7E9BD" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#F7E9BD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes bob {0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    .fl{animation:bob 4s ease-in-out infinite}
    .fl2{animation:bob 5s ease-in-out .8s infinite}
    .fl3{animation:bob 5.8s ease-in-out 1.5s infinite}
  </style>

  <!-- 天空 -->
  <rect x="0" y="0" width="960" height="540" fill="url(#sky)"/>
  <circle cx="750" cy="118" r="72" fill="url(#sunGlow)"/>
  <circle cx="750" cy="118" r="38" fill="#F2E3B8"/>
  <!-- 云 -->
  <g fill="#FFFFFF" opacity=".8">
    <ellipse cx="150" cy="100" rx="60" ry="16"/>
    <ellipse cx="192" cy="88" rx="40" ry="14"/>
    <ellipse cx="430" cy="70" rx="70" ry="15"/>
    <ellipse cx="482" cy="60" rx="36" ry="12"/>
  </g>
  <ellipse cx="620" cy="142" rx="50" ry="13" fill="#FFFFFF" opacity=".6"/>

  <!-- 远山 -->
  <path d="M0,300 L80,208 L150,268 L250,158 L330,246 L420,186 L520,262 L640,150 L740,246 L830,190 L960,268 L960,340 L0,340 Z" fill="#B9CFC6"/>
  <rect x="0" y="286" width="960" height="44" fill="url(#mist)" opacity=".8"/>
  <!-- 中山 -->
  <path d="M0,330 L110,248 L210,316 L330,240 L440,318 L560,252 L680,320 L800,258 L900,318 L960,290 L960,380 L0,380 Z" fill="#9DBAB0"/>
  <rect x="0" y="326" width="960" height="40" fill="url(#mist)" opacity=".7"/>

  <!-- 山脊上的宗门亭 -->
  <g>
    <path d="M604,282 Q640,248 676,282 Q664,274 640,274 Q616,274 604,282 Z" fill="#37514B"/>
    <path d="M604,282 L592,274" stroke="#37514B" stroke-width="4" stroke-linecap="round"/>
    <path d="M676,282 L688,274" stroke="#37514B" stroke-width="4" stroke-linecap="round"/>
    <rect x="618" y="282" width="4" height="13" fill="#4A6157"/>
    <rect x="658" y="282" width="4" height="13" fill="#4A6157"/>
    <rect x="610" y="295" width="60" height="4" rx="2" fill="#4A6157"/>
  </g>

  <!-- 地面 -->
  <path d="M0,382 Q160,352 320,360 Q520,370 700,356 Q840,346 960,362 L960,540 L0,540 Z" fill="#D9D0AC"/>
  <ellipse cx="300" cy="396" rx="180" ry="14" fill="#A8C48E" opacity=".5"/>
  <ellipse cx="700" cy="386" rx="200" ry="12" fill="#A8C48E" opacity=".5"/>

  <!-- 茅屋灵舍 -->
  <g>
    <rect x="706" y="314" width="150" height="62" fill="#EFE6D2"/>
    <path d="M686,318 Q781,266 876,318 Q852,308 781,308 Q710,308 686,318 Z" fill="#37514B"/>
    <path d="M686,318 L672,308" stroke="#37514B" stroke-width="5" stroke-linecap="round"/>
    <path d="M876,318 L890,308" stroke="#37514B" stroke-width="5" stroke-linecap="round"/>
    <rect x="770" y="340" width="26" height="36" rx="3" fill="#8F6B3D"/>
    <rect x="726" y="334" width="24" height="20" rx="3" fill="#F2E3B8" stroke="#8F6B3D" stroke-width="3"/>
    <rect x="812" y="334" width="24" height="20" rx="3" fill="#F2E3B8" stroke="#8F6B3D" stroke-width="3"/>
    <line x1="762" y1="376" x2="804" y2="376" stroke="#B99A6B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 篱笆 -->
  <g>
    <g fill="#A9805B">
      <rect x="52" y="396" width="9" height="46" rx="2"/>
      <rect x="92" y="398" width="9" height="44" rx="2"/>
      <rect x="132" y="396" width="9" height="46" rx="2"/>
      <rect x="172" y="398" width="9" height="44" rx="2"/>
      <rect x="212" y="400" width="9" height="42" rx="2"/>
    </g>
    <rect x="46" y="406" width="182" height="6" rx="3" fill="#B99A6B"/>
    <rect x="46" y="424" width="182" height="6" rx="3" fill="#B99A6B"/>
  </g>

  <!-- 石径 -->
  <g fill="#B9B3A4" opacity=".95">
    <ellipse cx="472" cy="528" rx="26" ry="10"/>
    <ellipse cx="452" cy="504" rx="22" ry="9"/>
    <ellipse cx="470" cy="482" rx="18" ry="8"/>
    <ellipse cx="456" cy="462" rx="15" ry="7"/>
  </g>

  <!-- 灵田一号（幼苗期） -->
  <g>
    <rect x="130" y="428" width="170" height="64" rx="14" fill="#B08D5F" stroke="#8F6B3D" stroke-width="6"/>
    <line x1="150" y1="449" x2="280" y2="449" stroke="#A17C50" stroke-width="2" opacity=".6"/>
    <line x1="150" y1="471" x2="280" y2="471" stroke="#A17C50" stroke-width="2" opacity=".6"/>
    <path d="M215,462 L215,446" stroke="#6E9B6E" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="205" cy="444" rx="10" ry="5" fill="#7FBF7F" transform="rotate(-30 205 444)"/>
    <ellipse cx="225" cy="444" rx="10" ry="5" fill="#7FBF7F" transform="rotate(30 225 444)"/>
  </g>

  <!-- 灵田二号（生长期） -->
  <g>
    <rect x="400" y="428" width="170" height="64" rx="14" fill="#B08D5F" stroke="#8F6B3D" stroke-width="6"/>
    <line x1="420" y1="449" x2="550" y2="449" stroke="#A17C50" stroke-width="2" opacity=".6"/>
    <line x1="420" y1="471" x2="550" y2="471" stroke="#A17C50" stroke-width="2" opacity=".6"/>
    <path d="M485,466 L485,430" stroke="#6E9B6E" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="470" cy="440" rx="13" ry="6" fill="#7FBF7F" transform="rotate(-32 470 440)"/>
    <ellipse cx="500" cy="440" rx="13" ry="6" fill="#7FBF7F" transform="rotate(32 500 440)"/>
    <ellipse cx="468" cy="452" rx="11" ry="5" fill="#9BCF9B" transform="rotate(-28 468 452)"/>
    <ellipse cx="502" cy="452" rx="11" ry="5" fill="#9BCF9B" transform="rotate(28 502 452)"/>
    <circle cx="485" cy="426" r="7" fill="#9BCF9B"/>
  </g>

  <!-- 灵田三号（成熟 + 聚灵阵） -->
  <g>
    <ellipse cx="755" cy="428" r="52" fill="url(#fieldGlow)" class="fl"/>
    <rect x="670" y="428" width="170" height="64" rx="14" fill="#B08D5F" stroke="#8F6B3D" stroke-width="6"/>
    <line x1="690" y1="449" x2="820" y2="449" stroke="#A17C50" stroke-width="2" opacity=".6"/>
    <line x1="690" y1="471" x2="820" y2="471" stroke="#A17C50" stroke-width="2" opacity=".6"/>
    <path d="M755,468 L755,410" stroke="#5E8F5E" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="736" cy="428" rx="16" ry="7" fill="#7FBF7F" transform="rotate(-34 736 428)"/>
    <ellipse cx="774" cy="428" rx="16" ry="7" fill="#7FBF7F" transform="rotate(34 774 428)"/>
    <ellipse cx="734" cy="446" rx="13" ry="6" fill="#9BCF9B" transform="rotate(-28 734 446)"/>
    <ellipse cx="776" cy="446" rx="13" ry="6" fill="#9BCF9B" transform="rotate(28 776 446)"/>
    <circle cx="755" cy="404" r="11" fill="#BFE3A8"/>
    <circle cx="755" cy="404" r="5.5" fill="#F2E3B8"/>
    <!-- 聚灵阵 -->
    <ellipse cx="755" cy="482" rx="62" ry="15" fill="none" stroke="#F0D48A" stroke-width="3" stroke-dasharray="10 7" opacity=".9"/>
    <g fill="#F0D48A">
      <rect x="750" y="464" width="10" height="5" rx="2"/>
      <rect x="750" y="495" width="10" height="5" rx="2"/>
      <rect x="688" y="479" width="5" height="10" rx="2"/>
      <rect x="817" y="479" width="5" height="10" rx="2"/>
    </g>
  </g>

  <!-- 前景草叶 -->
  <g fill="#6E8F6B">
    <path d="M14,540 Q22,484 40,470 Q30,506 34,540 Z"/>
    <path d="M44,540 Q56,496 76,486 Q62,514 62,540 Z"/>
    <path d="M0,540 Q10,510 24,504 Q16,524 18,540 Z"/>
    <path d="M920,540 Q910,490 894,480 Q904,510 900,540 Z"/>
    <path d="M946,540 Q940,504 924,494 Q934,518 932,540 Z"/>
  </g>
  <rect x="0" y="506" width="960" height="34" fill="url(#mist)" opacity=".45"/>

  <!-- 灵气光点 -->
  <g>
    <circle class="fl" cx="120" cy="224" r="4" fill="#FFE9A8"/>
    <circle class="fl2" cx="220" cy="300" r="3" fill="#CFEFD0"/>
    <circle class="fl3" cx="520" cy="238" r="4" fill="#FFE9A8"/>
    <circle class="fl2" cx="600" cy="320" r="3" fill="#CFEFD0"/>
    <circle class="fl" cx="840" cy="214" r="4" fill="#FFE9A8"/>
    <circle class="fl3" cx="360" cy="330" r="3" fill="#DFF3D8"/>
    <circle class="fl2" cx="540" cy="420" r="3" fill="#FFE9A8"/>
  </g>
</svg>
